name: Build & deploy gameassets.tr

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * *' # every day 04:17 UTC — pulls new packs / prices from itch.io
  workflow_dispatch:
    inputs:
      sync:
        description: 'Sync catalog from itch.io before building'
        type: boolean
        default: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Sync catalog from itch.io
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.sync)
        run: npm run sync

      - name: Commit catalog changes
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.sync)
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "gameassets-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore: sync catalog from itch.io"
            git push
          else
            echo "Catalog unchanged."
          fi

      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
