name: Build & deploy gameassets.tr

# The daily itch.io sync is started by scheduler.yml at the hours set in src/data/schedule.json.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'src/data/schedule.json'
  workflow_dispatch:
    inputs:
      sync:
        description: 'Sync catalog from itch.io before building'
        type: boolean
        default: true
      reason:
        description: 'Who started the run (panel or schedule)'
        type: string
        default: 'panel'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Sync catalog from itch.io
        if: github.event_name == 'workflow_dispatch' && inputs.sync
        run: npm run sync

      - name: Commit catalog changes
        id: commit
        if: github.event_name == 'workflow_dispatch' && inputs.sync
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "gameassets-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore: sync catalog from itch.io"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Catalog unchanged."
          fi

      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  indexnow:
    needs: [build, deploy]
    if: github.event_name == 'push' || needs.build.outputs.changed == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Notify Bing / Yandex via IndexNow
        run: sleep 60 && node scripts/indexnow.mjs
